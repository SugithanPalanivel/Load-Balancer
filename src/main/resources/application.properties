spring.application.name=dispatch-load-balancer
server.port=${PORT:8080}

# In-memory H2 by default (override with SPRING_DATASOURCE_* env vars for a persistent DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:dispatchdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Accept "high" / "High" / "HIGH"
spring.jackson.mapper.accept-case-insensitive-enums=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health
